[pytest]
# Explicitly add the repo root to sys.path for test collection, so
# `from src.validators import ...` resolves the same way whether pytest
# is run from the repo root, a subdirectory, or a CI runner -- instead
# of relying on pytest's implicit rootdir-insertion behavior.
pythonpath = .

# Only look for tests under tests/ -- keeps collection fast and avoids
# pytest accidentally trying to collect anything under src/ or docs/.
testpaths = tests

# Fail loudly on unknown marks instead of silently ignoring typos like
# @pytest.mark.parametrize misspelled as @pytest.mark.parametrise.
addopts = --strict-markers